[project]
name = "company-portfolio"
version = "0.1.0"
description = "기업 맞춤 포트폴리오·이력서 생성 스크립트 (Claude Code 하네스)"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
include = ["scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
